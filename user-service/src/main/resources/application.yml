server:
  port: 8080

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Keep these short: cache errors fall back to the DB, so a slow Redis must not stall requests.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

  cache:
    type: redis

app:
  cache:
    key-prefix: ${CACHE_KEY_PREFIX:user-service:v1:}
    user-ttl: ${CACHE_USER_TTL:10m}

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    access-token-seconds: ${JWT_ACCESS_SECONDS:900}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
    private-key: ${JWT_PRIVATE_KEY:keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY:keys/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
