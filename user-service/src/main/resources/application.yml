server:
  port: 8080
  # Client IP for rate limiting. "native" = Tomcat RemoteIpValve: X-Forwarded-For is honoured only when the
  # direct peer is a trusted proxy (default: private ranges 10/8, 172.16/12, 192.168/16, 127/8, ...).
  # A client connecting directly from a public IP cannot spoof it. If your load balancer sits on another
  # range, set SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES to a regex matching its IPs.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: user-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/users}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      # Keep these short: cache errors fall back to the DB, so a slow Redis must not stall requests.
      timeout: ${REDIS_TIMEOUT:500ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:500ms}

  cache:
    type: redis

app:
  cors:
    # Comma-separated browser origins allowed to call /api/** (e.g. https://app.example.com).
    # Empty (default) = no cross-origin access.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  cache:
    key-prefix: ${CACHE_KEY_PREFIX:user-service:v1:}
    user-ttl: ${CACHE_USER_TTL:10m}

  # Token-bucket policies: up to `capacity` requests in a burst, refilled by `refill-tokens`
  # every `refill-period`. on-redis-failure: local (default, per-instance in-memory limits) | allow | deny (503).
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    key-prefix: ${RATE_LIMIT_KEY_PREFIX:user-service:rl:}
    policies:
      login-ip:       { capacity: 20,  refill-tokens: 20,  refill-period: 1m }   # all login attempts per IP
      login-email-ip: { capacity: 5,   refill-tokens: 5,   refill-period: 15m }  # failed logins per account+IP
      login-email:    { capacity: 50,  refill-tokens: 50,  refill-period: 1h }   # failed logins per account
      register-ip:    { capacity: 5,   refill-tokens: 5,   refill-period: 1h }
      token-ip:       { capacity: 30,  refill-tokens: 30,  refill-period: 1m }
      user-api:       { capacity: 100, refill-tokens: 100, refill-period: 1m }

security:
  jwt:
    issuer: ${JWT_ISSUER:http://localhost:8080}
    access-token-seconds: ${JWT_ACCESS_SECONDS:900}
    refresh-token-days: ${JWT_REFRESH_DAYS:30}
    private-key: ${JWT_PRIVATE_KEY:keys/private.pem}
    public-key: ${JWT_PUBLIC_KEY:keys/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
