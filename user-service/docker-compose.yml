# Infrastructure only (run the app from your IDE / mvn):   docker compose up -d
# Full stack (infrastructure + app container):             docker compose --profile app up -d --build
services:
  postgres:
    image: postgres:17
    container_name: user-service-postgres
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: user-service-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    container_name: user-service-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/users
      REDIS_HOST: redis
      JWT_PRIVATE_KEY: /app/keys/private.pem
      JWT_PUBLIC_KEY: /app/keys/public.pem
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
